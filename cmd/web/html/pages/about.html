<div class="flex flex-col items-center mt-10 justify-center animate-fade-in">
    <h1 class="text-center text-4xl md:text-6xl font-bold text-peach-200">
        {{.Title}}
    </h1>
    <div class="flex items-center mt-6">
        <div
            class="ml-4 text-purp-200 text-lg text-justify mx-auto max-w-prose bg-midnight-900 bg-opacity-35 leading-relaxed break-words shadow-2xl p-5 rounded-lg animate-grow backdrop-blur-lg"
        >
            <p class="font-extrabold text-2xl mb-4 text-peach-300">{{.Greeting}}</p>
            <p class="font-semibold">
                {{.Introduction}}
            </p>
            <p class="mt-4 font-semibold">
                {{.WorkDescription}}
            </p>
            <p class="mt-4 font-semibold">
                {{.ContactInfo}}
                <a
                    href="mailto:{{.Email}}"
                    class="text-peach-400 underline"
                    >reach out</a
                >. {{.CallToAction}}
            </p>
            <p class="mt-4 font-semibold">
                <strong>{{.NextRoleQuestion}}</strong>
            </p>
            <p class="mt-4 font-semibold">
                {{.NextRoleAnswer}}
            </p>
            <p class="mt-4 font-semibold">
                <strong>{{.ProudProjectTitle}}</strong>
            </p>
            <p class="mt-4 font-semibold">
                {{.ProudProjectDescription}}
            </p>
        </div>
    </div>
</div>
